<!DOCTYPE html>
<html lang="pl">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="nav">
        <a href="index.html" class="nav__link">O MNIE</a>
        <a href="uslugi.html" class="nav__link">USŁUGI</a>
        <a href="portfolio.html" class="nav__link nav__link--active">PORTFOLIO</a>
        <a href="opinie.html" class="nav__link">OPINIE</a>
    </nav>
    <nav class="portfolio-side-nav" aria-label="Sekcje portfolio">

        <a
            href="#studio"
            class="portfolio-side-nav__link portfolio-side-nav__link--active"
            data-section="studio"
        >
            STUDIO
        </a>
    
        <a
            href="#plener"
            class="portfolio-side-nav__link"
            data-section="plener"
        >
            PLENER
        </a>
    
        <a
            href="#social-media"
            class="portfolio-side-nav__link"
            data-section="social-media"
        >
            SOCIAL MEDIA
        </a>
    
        <a
            href="#produkcje"
            class="portfolio-side-nav__link"
            data-section="produkcje"
        >
            PRODUKCJE
        </a>
    
    </nav>


    <main>

        <section class="portfolio-hero">

            <!-- LEWA DEKORACYJNA NAWIGACJA -->
            <div class="portfolio-hero__categories">

                <a href="#fotografia"
                   class="portfolio-hero__category portfolio-hero__category--photo">
                    FOTOGRAFIA
                </a>

                <a href="#social-media"
                   class="portfolio-hero__category portfolio-hero__category--social">
                    SOCIAL MEDIA
                </a>

                <a href="#produkcje"
                   class="portfolio-hero__category portfolio-hero__category--production">
                    PRODUKCJE
                </a>

                <svg
                    class="portfolio-hero__line"
                    viewBox="0 0 500 650"
                    preserveAspectRatio="none"
                    aria-hidden="true"
                >
                    <path
                        d="
                        M 500 20
                        H 145

                        C 75 20, 75 135, 145 135
                        H 390

                        C 470 135, 470 250, 390 250
                        H 145

                        C 75 250, 75 365, 145 365
                        H 500

                        C 580 365, 580 480, 500 480
                        H 145

                        C 75 480, 75 600, 145 600
                        H 500
                        "
                    />

                    <circle cx="500" cy="20" r="3"/>
                    <circle cx="145" cy="135" r="3"/>
                    <circle cx="390" cy="250" r="3"/>
                    <circle cx="145" cy="365" r="3"/>
                    <circle cx="500" cy="480" r="3"/>
                    <circle cx="145" cy="600" r="3"/>
                    <circle cx="500" cy="600" r="3"/>
                </svg>

            </div>


            <!-- PRAWA CZĘŚĆ HERO -->
            <div class="portfolio-hero__content">

                <p class="portfolio-hero__eyebrow">
                    MOJE REALIZACJE
                </p>

                <h1 class="portfolio-hero__title">
                    PORTFOLIO
                </h1>

                <p class="portfolio-hero__description">
                    OD POMYSŁU DO FINALNEGO EFEKTU:<br>
                    TWORZĘ PRZEMYŚLANE REALIZACJE, KTÓRE ŁĄCZĄ ESTETYKĘ, STRATEGIĘ<br>
                    I DOPRACOWANĄ PRODUKCJĘ
                </p>

            </div>

        </section>
        <section class="portfolio-gallery" id="studio">

            <!-- RZĄD A -->
            <div class="portfolio-gallery__row portfolio-gallery__row--a">
        
                <div class="portfolio-gallery__item portfolio-gallery__item--narrow">
                    <img src="assets/images/portfolio/studio/jpg11.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--wide">
                    <img src="assets/images/portfolio/studio/jpg12.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--narrow">
                    <img src="assets/images/portfolio/studio/jpg13.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--narrow">
                    <img src="assets/images/portfolio/studio/jpg14.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--wide">
                    <img src="assets/images/portfolio/studio/jpg15.jpg" alt="">
                </div>
        
            </div>
        
        
            <!-- RZĄD B -->
            <div class="portfolio-gallery__row portfolio-gallery__row--b">
        
                <div class="portfolio-gallery__item portfolio-gallery__item--wide">
                    <img src="assets/images/portfolio/studio/jpg21.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--narrow">
                    <img src="assets/images/portfolio/studio/jpg22.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--wide">
                    <img src="assets/images/portfolio/studio/jpg23.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--narrow">
                    <img src="assets/images/portfolio/studio/jpg24.jpg" alt="">
                </div>
        
                <div class="portfolio-gallery__item portfolio-gallery__item--narrow">
                    <img src="assets/images/portfolio/studio/jpg25.jpg" alt="">
                </div>
        
            </div>
        
        </section>
        

    </main>


    <script src="js/main.js"></script>
    <script src="js/portfolio.js"></script>

</html>
